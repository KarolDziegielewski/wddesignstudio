name: WD Design Studio

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"          #flutter-version: "3.24.0"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          BASE_href="/"

          flutter build web --release --base-href "$BASE_href"

      - name: Add SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Add CNAME
        run: echo "wddesignstudio.com" > build/web/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
