name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]        # zmień na master jeśli używasz 'master'
  workflow_dispatch:

permissions:                  # kluczowe, żeby uniknąć exit code 128
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Build (release)
        run: flutter build web --release --base-href "/wddesingstudio/"

      - name: Upload artifact (build/web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
